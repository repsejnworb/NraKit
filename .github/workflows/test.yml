name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: for f in *.lua Modules/*.lua tests/*.lua; do luac5.4 -p "$f"; done
      - name: Run tests
        run: |
          status=0
          for f in tests/*_test.lua; do lua5.4 tests/run.lua "$f" || status=1; done
          exit $status
